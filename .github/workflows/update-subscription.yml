name: Update Subscription

on:
  schedule:
    # 北京时间 8:00 (UTC 0:00) 和 20:00 (UTC 12:00)
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  update-subscription:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip -q
        pip install requests beautifulsoup4 lxml pyyaml -q
    
    - name: Run mibei crawler (source 1 of N)
      continue-on-error: true  # 米贝挂了不影响多源合并
      run: |
        python enhanced_crawler.py || echo "米贝爬取失败，继续多源合并"
    
    - name: Merge all sources -> output/clash.yaml + subscribe.txt
      run: |
        python merge_subscriptions.py
    
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        date +%Y-%m-%d > last_updated.txt
        git add output/ subscription.txt last_updated.txt crawler_status.json 2>/dev/null || git add -A output/ subscription.txt last_updated.txt
        if git diff --cached --quiet; then
          echo "无变化，跳过提交"
        else
          git commit -m "自动更新节点订阅 - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi
